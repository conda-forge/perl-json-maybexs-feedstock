{% set name = "perl-json-maybexs" %}
{% set version = "1.004008" %}
{% set sha256 = "cd3937afa78831f80a2ad5abab6c51b9e82fca4c31e5856ea208d598db5dc867" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/E/ET/ETHER/JSON-MaybeXS-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0
  script:
    - perl Makefile.PL INSTALLDIRS=vendor NO_PERLLOCAL=1 NO_PACKLIST=1
    - make
    - make test
    - make install VERBINST=1

requirements:
  build:
    - make
  host:
    - perl
    - perl-extutils-makemaker
    - perl-carp
    - perl-json-pp >=2.27300
    - perl-test-needs >=0.002006
  run:
    - perl
    - perl-carp
    - perl-json-pp >=2.27300

test:
  imports:
    - JSON::MaybeXS

about:
  home: https://metacpan.org/dist/JSON-MaybeXS
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_family: OTHER
  summary: 'Use Cpanel::JSON::XS with a fallback to JSON::XS and JSON::PP'
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cbrueffer
